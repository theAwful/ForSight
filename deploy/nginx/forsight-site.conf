# ForSight — install to /etc/nginx/sites-available/forsight then:
#   sudo ln -sf /etc/nginx/sites-available/forsight /etc/nginx/sites-enabled/
# Adjust root and ssl_certificate paths if you did not use /opt/forsight or /etc/nginx/certs.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/forsight.crt;
    ssl_certificate_key /etc/nginx/certs/forsight.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/forsight/frontend/dist;
    index index.html;

    location /docs/ {
        proxy_pass http://127.0.0.1:8000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
