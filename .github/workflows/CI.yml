name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: Unit, Integration & Functional tests + Coverage
  # ─────────────────────────────────────────────────────────────────────────────

  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      # ── Group 1: Unit tests (pure logic, no DB, no HTTP) ─────────────────
      - name: Run unit tests
        env:
          FORSIGHT_SECRET_KEY: "ci-test-secret-key"
          FORSIGHT_DATA_DIR: /tmp/forsight-test
        run: |
          pytest \
            tests/test_roe.py \
            tests/test_auth.py \
            tests/test_checklist.py \
            tests/test_nmap_parse.py \
            --cov=app \
            --cov-report=xml:coverage_unit.xml \
            -v --tb=short

      # ── Group 2: Integration tests (FastAPI + in-memory DB) ───────────────
      - name: Run integration tests
        env:
          FORSIGHT_SECRET_KEY: "ci-test-secret-key"
          FORSIGHT_DATA_DIR: /tmp/forsight-test
        run: |
          pytest \
            tests/test_api_auth.py \
            tests/test_api_projects.py \
            tests/test_api_misc.py \
            "tests/test_api_checklist_jobs.py::TestChecklistEndpoints" \
            "tests/test_api_checklist_jobs.py::TestUpdateChecklistItem" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_run_scan_blocked_before_pre_engagement" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_run_phase_blocked_before_pre_engagement" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_unknown_runner_returns_400" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_list_jobs_empty_initially" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_get_nonexistent_job_404" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_delete_nonexistent_job_404" \
            "tests/test_api_checklist_jobs.py::TestHealthEndpoint" \
            "tests/test_api_checklist_jobs.py::TestRunPhase" \
            --cov=app \
            --cov-append \
            --cov-report=xml:coverage_integration.xml \
            -v --tb=short

      # ── Merge coverage + enforce threshold ────────────────────────────────
      - name: Merge & report coverage
        env:
          FORSIGHT_SECRET_KEY: "ci-test-secret-key"
          FORSIGHT_DATA_DIR: /tmp/forsight-test
        run: |
          pytest \
            tests/test_roe.py \
            tests/test_auth.py \
            tests/test_checklist.py \
            tests/test_nmap_parse.py \
            tests/test_api_auth.py \
            tests/test_api_projects.py \
            tests/test_api_misc.py \
            "tests/test_api_checklist_jobs.py::TestChecklistEndpoints" \
            "tests/test_api_checklist_jobs.py::TestUpdateChecklistItem" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_run_scan_blocked_before_pre_engagement" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_run_phase_blocked_before_pre_engagement" \
            "tests/test_api_checklist_jobs.py::TestPreEngagementGate::test_unknown_runner_returns_400" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_list_jobs_empty_initially" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_get_nonexistent_job_404" \
            "tests/test_api_checklist_jobs.py::TestScanJobs::test_delete_nonexistent_job_404" \
            "tests/test_api_checklist_jobs.py::TestHealthEndpoint" \
            "tests/test_api_checklist_jobs.py::TestRunPhase" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=30 \
            -q --tb=no

      - name: Upload coverage (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: backend/coverage.xml

      - name: Upload coverage (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: backend/htmlcov/

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Lint + type check + unit tests
  # ─────────────────────────────────────────────────────────────────────────────

  frontend-tests:
    name: Frontend Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Run frontend unit tests
        run: npm run test --if-present -- --coverage --reporter=verbose

  # ─────────────────────────────────────────────────────────────────────────────
  # Secret scanning — detect leaked keys, tokens, passwords in commits
  # continue-on-error: true — reports findings, does not block gate
  # ─────────────────────────────────────────────────────────────────────────────

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --report-format json \
            --report-path gitleaks-results.json \
            --verbose \
            || true

      - name: Print summary
        if: always()
        run: |
          if [ -f gitleaks-results.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('gitleaks-results.json')); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null || echo "unknown")
            echo "Gitleaks findings: $COUNT"
            cat gitleaks-results.json
          else
            echo "No findings detected."
          fi

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks-results.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Dependency vulnerability scan — pip-audit (Python) + npm audit (Node)
  # continue-on-error: true — reports findings, does not block gate
  # ─────────────────────────────────────────────────────────────────────────────

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit \
            --requirement backend/requirements.txt \
            --format json \
            --output pip-audit-results.json \
            || true

      - name: Print Python audit summary
        if: always()
        run: |
          if [ -f pip-audit-results.json ]; then
            python3 - <<'EOF'
          import json
          with open("pip-audit-results.json") as f:
              data = json.load(f)
          pkgs = data if isinstance(data, list) else data.get("dependencies", [])
          total = sum(len(p.get("vulns", [])) for p in pkgs)
          print(f"pip-audit: {total} vulnerability/ies found across {len(pkgs)} packages")
          for pkg in pkgs:
              for v in pkg.get("vulns", []):
                  print(f"  {pkg['name']}=={pkg['version']} — {v['id']}: {v.get('description','')[:120]}")
          EOF
          else
            echo "pip-audit results file not found."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      - name: Audit Node dependencies
        working-directory: frontend
        run: |
          npm audit --json > npm-audit-results.json || true
          npm audit || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

      - name: Upload npm-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json

  # ─────────────────────────────────────────────────────────────────────────────
  # SAST — Bandit static analysis of Python source
  # Catches: shell injection, path traversal, hardcoded secrets, insecure patterns
  # continue-on-error: true — reports findings, does not block gate
  # B603/B607/B404 skipped — intentional subprocess use in tool runners
  # ─────────────────────────────────────────────────────────────────────────────

  sast-scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit \
            -r backend/app \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-results.json \
            --skip B603,B607,B404 \
            || true

      - name: Print Bandit summary
        if: always()
        run: |
          if [ -f bandit-results.json ]; then
            python3 - <<'EOF'
          import json
          with open("bandit-results.json") as f:
              data = json.load(f)
          results = data.get("results", [])
          high   = [r for r in results if r.get("issue_severity") == "HIGH"]
          medium = [r for r in results if r.get("issue_severity") == "MEDIUM"]
          print(f"Bandit: {len(high)} HIGH, {len(medium)} MEDIUM findings")
          for r in high:
              print(f"  [HIGH][{r['test_id']}] {r['issue_text']}")
              print(f"    {r['filename']}:{r['line_number']}")
          for r in medium:
              print(f"  [MED] [{r['test_id']}] {r['issue_text']}")
              print(f"    {r['filename']}:{r['line_number']}")
          EOF
          else
            echo "Bandit results file not found."
          fi

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker smoke test (build + health check)
  # ─────────────────────────────────────────────────────────────────────────────

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build --no-cache
        env:
          FORSIGHT_SECRET_KEY: ci-smoke-secret

      - name: Start services
        run: docker compose up -d
        env:
          FORSIGHT_SECRET_KEY: ci-smoke-secret

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Healthy after ${i}s" && exit 0
            echo "Attempt $i: $STATUS — waiting..."
            sleep 2
          done
          echo "Backend did not become healthy"; docker compose logs backend; exit 1

      - name: API smoke tests
        run: |
          curl -s -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"forsight","password":"forsight"}' \
            -c /tmp/cookies.txt | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('username')=='forsight'"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/api/projects \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Smoke"}' -b /tmp/cookies.txt)
          [ "$STATUS" = "200" ] || (echo "Create project failed: $STATUS" && exit 1)
          echo "All smoke tests passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Required gate — tests block merge, security scans report only
  # ─────────────────────────────────────────────────────────────────────────────

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, secret-scan, dependency-scan, sast-scan]
    if: always()
    steps:
      - name: Print security scan outcomes
        run: |
          echo "────────────────────────────────────────"
          echo "  CI Results Summary"
          echo "────────────────────────────────────────"
          echo "  backend-tests:    ${{ needs.backend-tests.result }}"
          echo "  frontend-tests:   ${{ needs.frontend-tests.result }}"
          echo "  secret-scan:      ${{ needs.secret-scan.result }} (non-blocking)"
          echo "  dependency-scan:  ${{ needs.dependency-scan.result }} (non-blocking)"
          echo "  sast-scan:        ${{ needs.sast-scan.result }} (non-blocking)"
          echo "────────────────────────────────────────"
          echo "Review security scan artifacts to assess current posture."

      - name: Enforce required gates (tests only)
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "Backend tests failed — blocking merge"; exit 1
          fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "Frontend tests failed — blocking merge"; exit 1
          fi
          echo "Required gates passed."
